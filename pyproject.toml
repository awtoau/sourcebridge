[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "sourcebridge"
version = "0.1.0"
description = "Evidence-backed, language-neutral source-porting engine"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
  "SQLAlchemy>=2.0,<2.1"
]

[project.optional-dependencies]
postgres = [
  "psycopg>=3.2,<4"
]

[project.scripts]
sourcebridge = "sourcebridge.cli:main"

[tool.setuptools]
packages = ["sourcebridge"]
